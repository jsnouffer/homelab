metallb:
  enabled: true
  fullnameOverride: metallb
  controller:
    logLevel: info
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 250Mi
  speaker:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 250Mi

  addresses:
    ip-address-pool-100:
      addresses:
        - 192.168.30.100-192.168.30.109
      autoAssign: true